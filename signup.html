<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>회원가입 | ARK STUDY LAB</title>
<meta name="robots" content="noindex,nofollow">
<link rel="stylesheet" href="app-style.css">
</head>
<body>

<div class="topbar">
  <a href="index.html" class="logo">ARK <span>STUDY LAB</span></a>
  <div class="top-actions">
    <a href="login.html">로그인</a>
  </div>
</div>

<div class="page-wrap">
  <div class="card">
    <h1>회원가입</h1>
    <p class="sub">학부모님은 먼저 학부모 계정으로, 자녀는 학부모 가입 후 학생 계정으로 가입해주세요.</p>

    <div id="msg" class="msg"></div>

    <form id="signupForm">
      <div class="role-toggle">
        <input type="radio" id="roleParent" name="role" value="parent" checked>
        <label for="roleParent">학부모</label>
        <input type="radio" id="roleStudent" name="role" value="student">
        <label for="roleStudent">학생(자녀)</label>
      </div>

      <div class="form-group">
        <label>이름</label>
        <input type="text" id="name" required placeholder="이름을 입력해주세요">
      </div>

      <div class="form-group">
        <label>이메일</label>
        <input type="email" id="email" required placeholder="example@email.com">
      </div>

      <div class="form-group">
        <label>비밀번호</label>
        <input type="password" id="password" required minlength="8" placeholder="8자 이상, 영문 대소문자·숫자·특수문자 포함">
      </div>

      <div class="form-group" id="parentEmailGroup" style="display:none;">
        <label>학부모 이메일</label>
        <input type="email" id="parentEmail" placeholder="학부모님이 가입하신 이메일을 입력해주세요">
        <div class="hint">이 이메일로 학부모님의 강의 수강완료 여부를 확인해 자녀 강의·학습 인증방이 열립니다.</div>
      </div>

      <div class="form-group consent-box">
        <label><input type="checkbox" name="privacyConsent" required> <a href="privacy.html" target="_blank" rel="noopener">개인정보처리방침</a>에 동의합니다.</label>
        <label><input type="checkbox" name="termsConsent" required> <a href="terms.html" target="_blank" rel="noopener">서비스 이용안내</a>를 확인했습니다.</label>
        <p class="hint">만 14세 미만 학생은 법정대리인인 학부모가 함께 확인하고 동의해야 합니다.</p>
      </div>

      <button type="submit" class="btn" id="submitBtn">가입하기</button>
    </form>

    <div class="switch-link">이미 계정이 있으신가요? <a href="login.html">로그인</a></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="supabase-client.js"></script>
<script>
const roleInputs = document.querySelectorAll('input[name="role"]');
const parentEmailGroup = document.getElementById('parentEmailGroup');
const parentEmailInput = document.getElementById('parentEmail');

roleInputs.forEach(r => r.addEventListener('change', () => {
  const isStudent = document.getElementById('roleStudent').checked;
  parentEmailGroup.style.display = isStudent ? 'block' : 'none';
  parentEmailInput.required = isStudent;
}));

function showMsg(text, type) {
  const el = document.getElementById('msg');
  el.textContent = text;
  el.className = 'msg show ' + type;
}

document.getElementById('signupForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const submitBtn = document.getElementById('submitBtn');
  submitBtn.disabled = true;
  submitBtn.textContent = '처리 중...';

  const role = document.querySelector('input[name="role"]:checked').value;
  const name = document.getElementById('name').value.trim();
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const parentEmail = document.getElementById('parentEmail').value.trim();

  if (role === 'student' && !parentEmail) {
    showMsg('학생으로 가입하려면 학부모 이메일을 입력해주세요.', 'error');
    submitBtn.disabled = false;
    submitBtn.textContent = '가입하기';
    return;
  }

  const { data, error } = await sb.auth.signUp({
    email,
    password,
    options: {
      data: {
        role,
        name,
        parent_email: role === 'student' ? parentEmail : null
      }
    }
  });

  if (error) {
    showMsg('가입 실패: ' + error.message, 'error');
    submitBtn.disabled = false;
    submitBtn.textContent = '가입하기';
    return;
  }

  showMsg(role === 'student'
    ? '학생 가입이 완료되었습니다. 이메일 인증 후 연결된 학부모의 승인을 받으면 강의실을 이용할 수 있어요.'
    : '가입이 완료되었습니다. 이메일로 전송된 인증 링크를 클릭한 후 로그인해주세요.', 'success');
  document.getElementById('signupForm').reset();
  submitBtn.disabled = false;
  submitBtn.textContent = '가입하기';
});
</script>
</body>
</html>
