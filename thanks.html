<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>신청 완료 | ARK STUDY LAB</title>
<meta name="robots" content="noindex,nofollow">
<link rel="stylesheet" href="app-style.css">
<style>
  .complete-card{text-align:center;max-width:560px;}
  .complete-icon{
    width:72px;height:72px;margin:0 auto 22px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    background:#eaf7ee;color:var(--green);font-size:34px;font-weight:800;
  }
  .complete-card h1{font-size:28px;margin-bottom:12px;}
  .complete-card .sub{font-size:15px;line-height:1.8;margin-bottom:28px;}
  .complete-info{
    background:#fbf3d9;border-radius:12px;padding:18px 20px;
    color:var(--navy-deep);font-size:14px;margin-bottom:26px;
  }
  .complete-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;}
  .complete-actions .btn{width:auto;padding:13px 24px;}
  .btn-secondary{background:var(--gold);color:var(--navy-deep);}
  .btn-secondary:hover{background:var(--gold-light);}
</style>
</head>
<body>

<div class="topbar">
  <a href="index.html" class="logo">ARK <span>STUDY LAB</span></a>
</div>

<main class="page-wrap">
  <section class="card complete-card">
    <div class="complete-icon">✓</div>
    <h1>신청이 완료되었습니다</h1>
    <p class="sub">
      상담·강의 신청서를 정상적으로 접수했습니다.<br>
      남겨주신 내용을 확인한 후 순서대로 연락드리겠습니다.
    </p>
    <div class="complete-info">
      영업일 기준 1~2일 이내에 연락드리겠습니다.<br>
      문의: chose1212@naver.com
    </div>
    <div class="complete-actions">
      <a href="index.html" class="btn">홈페이지로 돌아가기</a>
      <a href="mailto:chose1212@naver.com" class="btn btn-secondary">이메일 문의</a>
    </div>
  </section>
</main>

</body>
</html>
