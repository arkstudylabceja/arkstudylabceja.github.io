<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>관리자 | ARK STUDY LAB</title>
<meta name="robots" content="noindex,nofollow">
<link rel="stylesheet" href="app-style.css">
</head>
<body>

<div class="topbar">
  <a href="index.html" class="logo">ARK <span>STUDY LAB</span></a>
  <div class="top-actions">
    <a href="admin-teams.html">🧑‍🤝‍🧑 인증방 관리</a>
    <a href="settings.html">⚙️ 설정</a>
    <span id="userName"></span>
    <button id="logoutBtn">로그아웃</button>
  </div>
</div>

<div class="page-wrap top">
  <div class="card xwide" id="content">
    <div class="loading">불러오는 중...</div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="supabase-client.js"></script>
<script>
const contentEl = document.getElementById('content');
let allProfiles = [];
let deletionRequests = [];
const IMAGE_BUCKET = 'study-log-images';

async function init() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) {
    window.location.href = 'login.html';
    return;
  }

  const { data: profile, error } = await sb
    .from('profiles')
    .select('*')
    .eq('id', session.user.id)
    .single();

  if (error || !profile) {
    contentEl.innerHTML = '<p>프로필을 불러오지 못했습니다.</p>';
    return;
  }

  if (profile.role !== 'admin') {
    window.location.href = profile.role === 'parent' ? 'parent.html' : 'student.html';
    return;
  }

  if (profile.account_status === 'suspended') {
    await sb.auth.signOut();
    window.location.href = 'login.html?suspended=1';
    return;
  }

  document.getElementById('userName').textContent = profile.name + '님 (관리자)';

  const { data: profiles, error: listError } = await sb
    .from('profiles')
    .select('*');

  if (listError) {
    contentEl.innerHTML = `<p>학생·학부모 목록을 불러오지 못했습니다: ${listError.message}</p>`;
    return;
  }

  allProfiles = profiles.sort((a, b) => a.role.localeCompare(b.role) || a.name.localeCompare(b.name));
  const { data: requests } = await sb
    .from('account_deletion_requests')
    .select('*')
    .eq('status', 'pending')
    .order('requested_at', { ascending: false });
  deletionRequests = requests || [];
  render(allProfiles);
}

function roleLabel(role) {
  if (role === 'admin') return '관리자';
  if (role === 'parent') return '학부모';
  return '학생';
}

function noteFor(p) {
  if (p.role === 'parent') {
    return p.course_completed
      ? '<span class="status-badge unlocked" style="margin:0;">✓ 수강 완료</span>'
      : '<span class="status-badge locked" style="margin:0;">● 미완료</span>';
  }
  if (p.role === 'student') {
    return p.parent_email
      ? `학부모: ${p.parent_email}`
      : '<span style="color:var(--red);">학부모 연동 없음</span>';
  }
  return '-';
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function renderTable(list) {
  if (list.length === 0) {
    return '<p style="color:var(--muted);padding:24px 0;">검색 결과가 없습니다.</p>';
  }
  const rows = list.map(p => `
    <tr>
      <td>${p.name || '-'}</td>
      <td>${p.email || '-'}</td>
      <td><span class="role-badge ${p.role}">${roleLabel(p.role)}</span></td>
      <td>${noteFor(p)}</td>
      <td>${p.role === 'student' ? `<button class="btn-small" data-toggle-logs="${p.id}">개인 자료실 보기</button>` : '-'}</td>
      <td>
        <span class="status-badge ${p.account_status === 'suspended' ? 'locked' : 'unlocked'}" style="margin:0;">${p.account_status === 'suspended' ? '이용 정지' : '이용 중'}</span>
        ${p.role !== 'admin' ? `<button class="btn-small" style="margin-top:6px;" data-toggle-status="${p.id}" data-current-status="${p.account_status || 'active'}">${p.account_status === 'suspended' ? '다시 활성화' : '이용 정지'}</button>` : ''}
      </td>
    </tr>
  `).join('');

  return `
    <div class="table-scroll">
      <table class="data-table">
        <thead>
          <tr><th>이름</th><th>이메일</th><th>역할</th><th>비고</th><th>학습 기록</th><th>계정 상태</th></tr>
        </thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
  `;
}

async function toggleLogs(studentId, btn) {
  const existing = document.getElementById('logs-row-' + studentId);
  if (existing) {
    existing.remove();
    btn.textContent = '개인 자료실 보기';
    return;
  }

  document.querySelectorAll('[data-toggle-logs]').forEach(b => {
    const rowId = 'logs-row-' + b.getAttribute('data-toggle-logs');
    const openRow = document.getElementById(rowId);
    if (openRow) openRow.remove();
    b.textContent = '개인 자료실 보기';
  });

  btn.textContent = '불러오는 중...';

  const { data: logs, error } = await sb
    .from('study_logs')
    .select('*')
    .eq('student_id', studentId)
    .order('study_date', { ascending: false })
    .limit(10);

  btn.textContent = '개인 자료실 닫기';

  const tr = document.createElement('tr');
  tr.id = 'logs-row-' + studentId;
  const td = document.createElement('td');
  td.colSpan = 6;
  td.style.background = '#fbfbfd';

  if (error) {
    td.innerHTML = `<p class="empty-note">기록을 불러오지 못했습니다: ${error.message}</p>`;
  } else if (!logs || logs.length === 0) {
    td.innerHTML = '<p class="empty-note">아직 학습 기록이 없어요.</p>';
  } else {
    const logsWithImages = await Promise.all(logs.map(async log => {
      let imageUrl = null;
      if (log.image_path) {
        const { data } = await sb.storage.from(IMAGE_BUCKET).createSignedUrl(log.image_path, 3600);
        imageUrl = data ? data.signedUrl : null;
      }
      return { ...log, imageUrl };
    }));

    td.innerHTML = logsWithImages.map(log => `
      <div class="log-entry" style="margin-bottom:8px;">
        <div class="log-main">
          <div class="log-date">${log.study_date}${log.subject ? ' · ' + escapeHtml(log.subject) : ''}</div>
          <div class="log-content">${escapeHtml(log.content)}</div>
          ${log.minutes_spent ? `<div class="log-minutes">⏱ ${log.minutes_spent}분</div>` : ''}
          ${log.imageUrl ? `<a href="${log.imageUrl}" target="_blank" rel="noopener"><img src="${log.imageUrl}" alt="학생 개인 자료실 공부 사진" style="display:block;max-width:100%;max-height:420px;margin-top:12px;border-radius:12px;object-fit:contain;"></a>` : ''}
        </div>
      </div>
    `).join('');
  }

  tr.appendChild(td);
  btn.closest('tr').after(tr);
}

function bindTableEvents() {
  document.querySelectorAll('[data-toggle-logs]').forEach(btn => {
    btn.addEventListener('click', () => {
      toggleLogs(btn.getAttribute('data-toggle-logs'), btn);
    });
  });
  document.querySelectorAll('[data-toggle-status]').forEach(btn => {
    btn.addEventListener('click', async () => {
      const userId = btn.getAttribute('data-toggle-status');
      const current = btn.getAttribute('data-current-status');
      const next = current === 'suspended' ? 'active' : 'suspended';
      const label = next === 'suspended' ? '이 계정의 이용을 정지할까요?' : '이 계정을 다시 활성화할까요?';
      if (!confirm(label)) return;
      btn.disabled = true;
      const { error } = await sb.from('profiles').update({ account_status: next }).eq('id', userId);
      if (error) { alert('계정 상태를 변경하지 못했습니다: ' + error.message); btn.disabled = false; return; }
      const target = allProfiles.find(p => p.id === userId);
      if (target) target.account_status = next;
      render(allProfiles);
    });
  });
}

function renderDeletionRequests() {
  if (!deletionRequests.length) return '<p style="color:var(--muted);">대기 중인 삭제 요청이 없습니다.</p>';
  return deletionRequests.map(r => {
    const p = allProfiles.find(item => item.id === r.user_id) || {};
    return `<div class="log-entry" style="margin-bottom:10px;">
      <div class="log-main">
        <strong>${escapeHtml(p.name || '이름 없음')} · ${escapeHtml(p.email || '')}</strong>
        <p>${r.reason ? escapeHtml(r.reason) : '사유 없음'}</p>
        <button class="btn-small" data-handle-request="${r.id}" data-user-id="${r.user_id}">계정 정지 및 확인 완료</button>
      </div>
    </div>`;
  }).join('');
}

function bindDeletionEvents() {
  document.querySelectorAll('[data-handle-request]').forEach(btn => {
    btn.addEventListener('click', async () => {
      if (!confirm('이 계정을 정지하고 삭제 요청을 확인 완료로 표시할까요?')) return;
      btn.disabled = true;
      const requestId = btn.getAttribute('data-handle-request');
      const userId = btn.getAttribute('data-user-id');
      const { error: profileError } = await sb.from('profiles').update({ account_status: 'suspended' }).eq('id', userId);
      if (profileError) { alert('계정을 정지하지 못했습니다: ' + profileError.message); btn.disabled = false; return; }
      const { error: requestError } = await sb.from('account_deletion_requests')
        .update({ status: 'completed', resolved_at: new Date().toISOString() })
        .eq('id', requestId);
      if (requestError) { alert('요청 상태를 변경하지 못했습니다: ' + requestError.message); btn.disabled = false; return; }
      deletionRequests = deletionRequests.filter(r => r.id !== requestId);
      const target = allProfiles.find(p => p.id === userId);
      if (target) target.account_status = 'suspended';
      render(allProfiles);
    });
  });
}

function render(list) {
  contentEl.innerHTML = `
    <h1>학생·학부모 관리</h1>
    <p class="sub">가입된 전체 계정 목록입니다.</p>
    <div class="toolbar">
      <input type="text" id="searchInput" placeholder="이름 또는 이메일로 검색">
      <span class="count" id="countLabel"></span>
    </div>
    <div id="tableWrap">${renderTable(list)}</div>
    <h2 style="margin-top:36px;font-size:22px;">계정 삭제 요청</h2>
    <div id="deletionRequestWrap">${renderDeletionRequests()}</div>
  `;

  document.getElementById('countLabel').textContent = `총 ${list.length}명`;
  bindTableEvents();
  bindDeletionEvents();

  document.getElementById('searchInput').addEventListener('input', (e) => {
    const q = e.target.value.trim().toLowerCase();
    const filtered = allProfiles.filter(p =>
      (p.name || '').toLowerCase().includes(q) || (p.email || '').toLowerCase().includes(q)
    );
    document.getElementById('tableWrap').innerHTML = renderTable(filtered);
    document.getElementById('countLabel').textContent = `총 ${filtered.length}명`;
    bindTableEvents();
  });
}

document.getElementById('logoutBtn').addEventListener('click', async () => {
  await sb.auth.signOut();
  window.location.href = 'login.html';
});

init();
</script>
</body>
</html>
