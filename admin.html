<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>관리자 | ARK STUDY LAB</title>
<meta name="robots" content="noindex,nofollow">
<link rel="stylesheet" href="app-style.css?v=20261117d">
</head>
<body>

<div class="topbar">
  <a href="index.html" class="logo">ARK <span>STUDY LAB</span></a>
  <div class="top-actions">
    <a href="admin-teams.html">🧑‍🤝‍🧑 인증방 관리</a>
    <a href="settings.html">⚙️ 설정</a>
    <span id="userName"></span>
    <button id="logoutBtn">로그아웃</button>
  </div>
</div>

<div class="page-wrap top">
  <div class="card xwide" id="content">
    <div class="loading">불러오는 중...</div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="supabase-client.js"></script>
<script src="study-feedback.js?v=20261117d"></script>
<script>
const contentEl = document.getElementById('content');
let allProfiles = [];
let deletionRequests = [];
let myAdminId = null;
const IMAGE_BUCKET = 'study-log-images';
const LOG_COLUMNS = 'id, student_id, study_date, subject, content, minutes_spent, image_path, created_at';
const ADMIN_FEEDBACK_COLUMNS = 'body, status, published_at, updated_at';
const ADMIN_EMBEDS = ['study_log_feedback(' + ADMIN_FEEDBACK_COLUMNS + ')', IMAGES_EMBED];

async function init() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) {
    window.location.href = 'login.html';
    return;
  }

  const { data: profile, error } = await sb
    .from('profiles')
    .select('*')
    .eq('id', session.user.id)
    .single();

  if (error || !profile) {
    contentEl.innerHTML = '<p>프로필을 불러오지 못했습니다.</p>';
    return;
  }

  if (profile.role !== 'admin') {
    window.location.href = profile.role === 'parent' ? 'parent.html' : 'student.html';
    return;
  }

  if (profile.account_status === 'suspended') {
    await sb.auth.signOut();
    window.location.href = 'login.html?suspended=1';
    return;
  }

  document.getElementById('userName').textContent = profile.name + '님 (관리자)';
  myAdminId = profile.id;

  const { data: profiles, error: listError } = await sb
    .from('profiles')
    .select('*');

  if (listError) {
    contentEl.innerHTML = `<p>학생·학부모 목록을 불러오지 못했습니다: ${listError.message}</p>`;
    return;
  }

  allProfiles = profiles.sort((a, b) => a.role.localeCompare(b.role) || a.name.localeCompare(b.name));
  const { data: requests } = await sb
    .from('account_deletion_requests')
    .select('*')
    .eq('status', 'pending')
    .order('requested_at', { ascending: false });
  deletionRequests = requests || [];
  render(allProfiles);
}

function roleLabel(role) {
  if (role === 'admin') return '관리자';
  if (role === 'parent') return '학부모';
  if (role === 'analyst') return 'AI 분석';
  return '학생';
}

function noteFor(p) {
  if (p.role === 'parent') {
    return p.course_completed
      ? '<span class="status-badge unlocked" style="margin:0;">✓ 수강 완료</span>'
      : '<span class="status-badge locked" style="margin:0;">● 미완료</span>';
  }
  if (p.role === 'student') {
    return p.parent_email
      ? `학부모: ${escapeHtml(p.parent_email)}`
      : '<span style="color:var(--red);">학부모 연동 없음</span>';
  }
  return '-';
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function renderTable(list) {
  if (list.length === 0) {
    return '<p style="color:var(--muted);padding:24px 0;">검색 결과가 없습니다.</p>';
  }
  const rows = list.map(p => `
    <tr>
      <td>${escapeHtml(p.name || '-')}</td>
      <td>${escapeHtml(p.email || '-')}</td>
      <td><span class="role-badge ${p.role}">${roleLabel(p.role)}</span></td>
      <td>${noteFor(p)}</td>
      <td>${p.role === 'student' ? `<button class="btn-small" data-toggle-logs="${p.id}">개인 자료실 보기</button>` : '-'}</td>
      <td>
        <span class="status-badge ${p.account_status === 'suspended' ? 'locked' : 'unlocked'}" style="margin:0;">${p.account_status === 'suspended' ? '이용 정지' : '이용 중'}</span>
        ${p.role !== 'admin' ? `<button class="btn-small" style="margin-top:6px;" data-toggle-status="${p.id}" data-current-status="${p.account_status || 'active'}">${p.account_status === 'suspended' ? '다시 활성화' : '이용 정지'}</button>` : ''}
      </td>
    </tr>
  `).join('');

  return `
    <div class="table-scroll">
      <table class="data-table">
        <thead>
          <tr><th>이름</th><th>이메일</th><th>역할</th><th>비고</th><th>학습 기록</th><th>계정 상태</th></tr>
        </thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
  `;
}

async function toggleLogs(studentId, btn) {
  const existing = document.getElementById('logs-row-' + studentId);
  if (existing) {
    existing.remove();
    btn.textContent = '개인 자료실 보기';
    return;
  }

  document.querySelectorAll('[data-toggle-logs]').forEach(b => {
    const rowId = 'logs-row-' + b.getAttribute('data-toggle-logs');
    const openRow = document.getElementById(rowId);
    if (openRow) openRow.remove();
    b.textContent = '개인 자료실 보기';
  });

  btn.textContent = '불러오는 중...';

  const { data: logs, error } = await selectWithEmbeds(columns => sb
    .from('study_logs')
    .select(columns)
    .eq('student_id', studentId)
    .order('study_date', { ascending: false })
    .order('created_at', { ascending: false })
    .limit(10), LOG_COLUMNS, ADMIN_EMBEDS);

  btn.textContent = '개인 자료실 닫기';

  const tr = document.createElement('tr');
  tr.id = 'logs-row-' + studentId;
  const td = document.createElement('td');
  td.colSpan = 6;
  td.style.background = '#fbfbfd';

  if (error) {
    td.innerHTML = `<p class="empty-note">기록을 불러오지 못했습니다: ${error.message}</p>`;
  } else if (!logs || logs.length === 0) {
    td.innerHTML = '<p class="empty-note">아직 학습 기록이 없어요.</p>';
  } else {
    const logsWithImages = await withImageUrls(logs);
    td.innerHTML = logsWithImages.map(log => renderCoachLog(log, null)).join('');
    bindCoachEditors(td);
  }

  tr.appendChild(td);
  btn.closest('tr').after(tr);
}

async function attachAiDrafts(logs) {
  const ids = logs.map(l => l.id);
  if (!ids.length) return logs;
  const { data, error } = await sb
    .from('study_log_ai_drafts')
    .select('log_id, draft_for_parent, teacher_notes, created_at')
    .in('log_id', ids);
  if (error || !data) return logs;
  const byId = {};
  data.forEach(d => { byId[d.log_id] = d; });
  return logs.map(l => ({ ...l, aiDraft: byId[l.id] || null }));
}

async function withImageUrls(logs) {
  logs = await attachAiDrafts(logs);
  return attachImageUrls(logs);
}

function studentNameOf(studentId) {
  const p = allProfiles.find(item => item.id === studentId);
  return p ? p.name : '';
}

function feedbackStatusHtml(fb) {
  if (fb && fb.status === 'published') {
    const date = fb.published_at ? new Date(fb.published_at).toLocaleDateString('ko-KR') : '';
    return `<span class="status-badge unlocked" style="margin:0;">✓ 학부모님께 보냄${date ? ' · ' + date : ''}</span>`;
  }
  if (fb && fb.body) {
    return '<span class="status-badge pending" style="margin:0;">임시 저장됨 (학부모님께 안 보임)</span>';
  }
  return '<span class="status-badge locked" style="margin:0;">● 코칭 전</span>';
}

function renderCoachLog(log, studentName) {
  const fb = feedbackOf(log);
  const published = fb && fb.status === 'published';
  const hasFeedbackTable = Object.prototype.hasOwnProperty.call(log, 'study_log_feedback');
  const ai = log.aiDraft;
  const useAiDraft = ai && !(fb && fb.body);
  const textareaValue = fb && fb.body ? fb.body : (ai ? ai.draft_for_parent : '');
  return `
    <div class="log-entry" style="margin-bottom:10px;">
      <div class="log-main">
        <div class="log-date">${log.study_date}${log.subject ? ' · ' + escapeHtml(log.subject) : ''}${studentName ? ' · <strong>' + escapeHtml(studentName) + '</strong>' : ''}</div>
        <div class="log-content">${escapeHtml(log.content)}</div>
        ${log.minutes_spent ? `<div class="log-minutes">⏱ ${log.minutes_spent}분</div>` : ''}
        ${renderLogImages(log.imageUrls, '학생 개인 자료실 공부 사진')}
        ${hasFeedbackTable ? `
        <div class="coach-editor" data-log-id="${log.id}">
          ${ai && ai.teacher_notes ? `<div class="ai-notes"><div class="ai-notes-title">🤖 AI 분석 메모 <span>선생님만 보여요</span></div><div class="ai-notes-body">${escapeHtml(ai.teacher_notes)}</div></div>` : ''}
          <label>💬 선생님 코칭${useAiDraft ? ' <span class="ai-tag">🤖 AI 초안이 들어 있어요. 확인하고 고쳐서 보내주세요</span>' : ''}</label>
          <textarea data-feedback-text placeholder="학부모님께 보낼 코칭을 적어주세요">${escapeHtml(textareaValue)}</textarea>
          <div class="coach-actions">
            ${published ? '' : '<button type="button" class="btn-small" data-save-feedback="draft">임시 저장</button>'}
            <button type="button" class="btn-small coach-send" data-save-feedback="published">${published ? '수정해서 다시 보내기' : '학부모님께 보내기'}</button>
            <span data-feedback-status>${feedbackStatusHtml(fb)}</span>
          </div>
        </div>` : ''}
      </div>
    </div>`;
}

function bindCoachEditors(container, onPublished) {
  container.querySelectorAll('.coach-editor').forEach(editor => {
    const logId = editor.getAttribute('data-log-id');
    editor.querySelectorAll('[data-save-feedback]').forEach(btn => {
      btn.addEventListener('click', async () => {
        const status = btn.getAttribute('data-save-feedback');
        const body = editor.querySelector('[data-feedback-text]').value.trim();
        if (!body) { alert('코칭 내용을 먼저 적어주세요.'); return; }
        if (status === 'published' && !confirm('이 코칭을 학부모님 화면에 보낼까요?')) return;
        const originalText = btn.textContent;
        btn.disabled = true;
        btn.textContent = '저장 중...';
        const now = new Date().toISOString();
        const row = {
          log_id: logId,
          body,
          status,
          updated_by: myAdminId,
          updated_at: now,
          published_at: status === 'published' ? now : null
        };
        const { error } = await sb.from('study_log_feedback').upsert(row, { onConflict: 'log_id' });
        btn.disabled = false;
        btn.textContent = originalText;
        if (error) { alert('저장하지 못했습니다: ' + error.message); return; }
        const statusEl = editor.querySelector('[data-feedback-status]');
        statusEl.innerHTML = feedbackStatusHtml(row);
        if (status === 'published') {
          statusEl.insertAdjacentHTML('beforeend', ' <span class="hint" data-mail-status>✉️ 알림 메일 보내는 중...</span>');
          notifyParent(logId).then(({ result, error }) => {
            const mailEl = statusEl.querySelector('[data-mail-status]');
            if (!mailEl) return;
            if (result === 'sent') mailEl.textContent = '✉️ 학부모님께 알림 메일 발송';
            else if (result === 'skipped') mailEl.textContent = '✉️ 이미 알림 메일을 보냈어요';
            else if (result === 'off') mailEl.remove();
            else { mailEl.style.color = 'var(--red)'; mailEl.textContent = '✉️ 알림 메일 실패: ' + (NOTIFY_ERROR_TEXT[error] || error || '알 수 없는 오류') + ' (코칭은 저장됨)'; }
          });
          const draftBtn = editor.querySelector('[data-save-feedback="draft"]');
          if (draftBtn) draftBtn.remove();
          btn.textContent = '수정해서 다시 보내기';
          if (onPublished) onPublished(logId);
        }
      });
    });
  });
}

async function loadPendingCoaching() {
  const wrap = document.getElementById('pendingCoachWrap');
  if (!wrap) return;
  const { data: logs, error } = await selectWithEmbeds(columns => sb
    .from('study_logs')
    .select(columns)
    .order('created_at', { ascending: false })
    .limit(60), LOG_COLUMNS, ADMIN_EMBEDS);

  if (error) {
    wrap.innerHTML = `<p class="empty-note">기록을 불러오지 못했습니다: ${escapeHtml(error.message)}</p>`;
    return;
  }
  if (logs && logs.length && !Object.prototype.hasOwnProperty.call(logs[0], 'study_log_feedback')) {
    wrap.innerHTML = '<p class="empty-note">코칭 기능을 쓰려면 Supabase에서 015_study_log_feedback.sql을 먼저 실행해주세요.</p>';
    return;
  }
  const pending = (logs || []).filter(log => {
    const fb = feedbackOf(log);
    return !fb || fb.status !== 'published';
  });
  const countEl = document.getElementById('pendingCount');
  if (countEl) countEl.textContent = pending.length ? `${pending.length}건` : '';
  if (!pending.length) {
    wrap.innerHTML = '<p class="empty-note">코칭을 기다리는 기록이 없어요. 👍</p>';
    return;
  }
  const shown = pending.slice(0, 20);
  const withImages = await withImageUrls(shown);
  wrap.innerHTML = withImages.map(log => `<div data-pending-log="${log.id}">${renderCoachLog(log, studentNameOf(log.student_id))}</div>`).join('')
    + (pending.length > shown.length ? `<p class="hint">최근 20건만 보여드려요. 나머지 ${pending.length - shown.length}건은 위 기록을 보내면 이어서 보여요.</p>` : '');
  bindCoachEditors(wrap, logId => {
    const item = wrap.querySelector(`[data-pending-log="${logId}"]`);
    if (item) {
      item.style.opacity = '0.5';
      setTimeout(() => { item.remove(); if (!wrap.querySelector('[data-pending-log]')) loadPendingCoaching(); }, 900);
    }
    const remaining = wrap.querySelectorAll('[data-pending-log]').length - 1;
    if (countEl) countEl.textContent = remaining > 0 ? `${remaining}건` : '';
  });
}

function bindTableEvents() {
  document.querySelectorAll('[data-toggle-logs]').forEach(btn => {
    btn.addEventListener('click', () => {
      toggleLogs(btn.getAttribute('data-toggle-logs'), btn);
    });
  });
  document.querySelectorAll('[data-toggle-status]').forEach(btn => {
    btn.addEventListener('click', async () => {
      const userId = btn.getAttribute('data-toggle-status');
      const current = btn.getAttribute('data-current-status');
      const next = current === 'suspended' ? 'active' : 'suspended';
      const label = next === 'suspended' ? '이 계정의 이용을 정지할까요?' : '이 계정을 다시 활성화할까요?';
      if (!confirm(label)) return;
      btn.disabled = true;
      const { error } = await sb.from('profiles').update({ account_status: next }).eq('id', userId);
      if (error) { alert('계정 상태를 변경하지 못했습니다: ' + error.message); btn.disabled = false; return; }
      const target = allProfiles.find(p => p.id === userId);
      if (target) target.account_status = next;
      render(allProfiles);
    });
  });
}

function renderDeletionRequests() {
  if (!deletionRequests.length) return '<p style="color:var(--muted);">대기 중인 삭제 요청이 없습니다.</p>';
  return deletionRequests.map(r => {
    const p = allProfiles.find(item => item.id === r.user_id) || {};
    return `<div class="log-entry" style="margin-bottom:10px;">
      <div class="log-main">
        <strong>${escapeHtml(p.name || '이름 없음')} · ${escapeHtml(p.email || '')}</strong>
        <p>${r.reason ? escapeHtml(r.reason) : '사유 없음'}</p>
        <button class="btn-small" data-handle-request="${r.id}" data-user-id="${r.user_id}">계정 정지 및 확인 완료</button>
      </div>
    </div>`;
  }).join('');
}

function bindDeletionEvents() {
  document.querySelectorAll('[data-handle-request]').forEach(btn => {
    btn.addEventListener('click', async () => {
      if (!confirm('이 계정을 정지하고 삭제 요청을 확인 완료로 표시할까요?')) return;
      btn.disabled = true;
      const requestId = btn.getAttribute('data-handle-request');
      const userId = btn.getAttribute('data-user-id');
      const { error: profileError } = await sb.from('profiles').update({ account_status: 'suspended' }).eq('id', userId);
      if (profileError) { alert('계정을 정지하지 못했습니다: ' + profileError.message); btn.disabled = false; return; }
      const { error: requestError } = await sb.from('account_deletion_requests')
        .update({ status: 'completed', resolved_at: new Date().toISOString() })
        .eq('id', requestId);
      if (requestError) { alert('요청 상태를 변경하지 못했습니다: ' + requestError.message); btn.disabled = false; return; }
      deletionRequests = deletionRequests.filter(r => r.id !== requestId);
      const target = allProfiles.find(p => p.id === userId);
      if (target) target.account_status = 'suspended';
      render(allProfiles);
    });
  });
}

function render(list) {
  contentEl.innerHTML = `
    <h1>학생·학부모 관리</h1>
    <p class="sub">가입된 전체 계정 목록입니다.</p>
    <h2 style="font-size:22px;margin-bottom:6px;">📝 코칭 대기 <span id="pendingCount" style="font-size:15px;color:var(--red);"></span></h2>
    <p class="hint" style="margin-bottom:14px;">학생이 올린 기록 중 아직 코칭을 보내지 않은 기록이에요. 최신 순입니다.</p>
    <div id="pendingCoachWrap"><div class="loading" style="padding:24px 0;">불러오는 중...</div></div>
    <h2 style="margin-top:36px;font-size:22px;margin-bottom:12px;">전체 계정</h2>
    <div class="toolbar">
      <input type="text" id="searchInput" placeholder="이름 또는 이메일로 검색">
      <span class="count" id="countLabel"></span>
    </div>
    <div id="tableWrap">${renderTable(list)}</div>
    <h2 style="margin-top:36px;font-size:22px;">계정 삭제 요청</h2>
    <div id="deletionRequestWrap">${renderDeletionRequests()}</div>
  `;

  document.getElementById('countLabel').textContent = `총 ${list.length}명`;
  bindTableEvents();
  bindDeletionEvents();
  loadPendingCoaching();

  document.getElementById('searchInput').addEventListener('input', (e) => {
    const q = e.target.value.trim().toLowerCase();
    const filtered = allProfiles.filter(p =>
      (p.name || '').toLowerCase().includes(q) || (p.email || '').toLowerCase().includes(q)
    );
    document.getElementById('tableWrap').innerHTML = renderTable(filtered);
    document.getElementById('countLabel').textContent = `총 ${filtered.length}명`;
    bindTableEvents();
  });
}

document.getElementById('logoutBtn').addEventListener('click', async () => {
  await sb.auth.signOut();
  window.location.href = 'login.html';
});

init();
</script>
</body>
</html>
