<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>상담함 | ARK STUDY LAB</title>
<meta name="robots" content="noindex,nofollow">
<link rel="stylesheet" href="app-style.css?v=20261120a">
</head>
<body>

<div class="topbar">
  <a href="index.html" class="logo">ARK <span>STUDY LAB</span></a>
  <div class="top-actions">
    <a href="admin.html">학생·학부모 관리</a>
    <a href="community.html">👪 이야기방</a>
    <span id="userName"></span>
    <button id="logoutBtn">로그아웃</button>
  </div>
</div>

<div class="page-wrap top">
  <div class="card wide" id="content">
    <div class="loading">불러오는 중...</div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="supabase-client.js"></script>
<script src="talk.js?v=20261120a"></script>
<script>
const contentEl = document.getElementById('content');
let me = null;
let filter = 'waiting';
let channel = null;
const ROLE_LABEL = { parent: '학부모', student: '학생' };

async function init() {
  me = await talkRequireProfile(['admin']);
  if (!me) return;
  const threadId = new URLSearchParams(location.search).get('t');
  if (threadId) showThread(threadId); else showList();
}

async function showList() {
  stopRealtime();
  history.replaceState(null, '', 'admin-consult.html');
  contentEl.innerHTML = `
    <h1>💬 상담함</h1>
    <p class="sub">학부모님과 학생이 남긴 1:1 상담이에요. 답하면 상대방 상담 페이지에 바로 보여요.</p>
    <div class="talk-filter">
      <button data-f="waiting">답변 필요</button>
      <button data-f="answered">답변함</button>
      <button data-f="closed">마무리</button>
      <button data-f="all">전체</button>
    </div>
    <div id="threadList"><div class="loading">불러오는 중...</div></div>
  `;
  contentEl.querySelectorAll('[data-f]').forEach(b => {
    b.classList.toggle('active', b.dataset.f === filter);
    b.addEventListener('click', () => { filter = b.dataset.f; showList(); });
  });
  loadThreads();
}

async function loadThreads() {
  const el = document.getElementById('threadList');
  let q = sb
    .from('consult_threads')
    .select('id, subject, status, last_message_at, author_id')
    .order('last_message_at', { ascending: filter === 'waiting' })
    .limit(100);
  if (filter !== 'all') q = q.eq('status', filter);
  const { data, error } = await q;
  if (error) { el.innerHTML = `<p class="empty-note">${talkSetupError(error)}</p>`; return; }
  if (!data.length) {
    el.innerHTML = `<p class="empty-note">${filter === 'waiting' ? '답변을 기다리는 상담이 없어요. 👍' : '상담이 없어요.'}</p>`;
    return;
  }
  const people = await loadPeople(data.map(t => t.author_id));
  el.innerHTML = data.map(t => {
    const p = people[t.author_id] || {};
    return `
    <a class="talk-row" href="admin-consult.html?t=${t.id}" data-thread="${t.id}">
      <div class="talk-row-main">
        <div class="talk-row-title">${escapeHtml(t.subject)}</div>
        <div class="talk-meta">${escapeHtml(p.name || '(알 수 없음)')} ${ROLE_LABEL[p.role] ? '· ' + ROLE_LABEL[p.role] : ''} · ${talkTime(t.last_message_at)}</div>
      </div>
      ${talkStatusBadge(t.status, true)}
    </a>`;
  }).join('');
  el.querySelectorAll('[data-thread]').forEach(a => a.addEventListener('click', e => {
    e.preventDefault();
    showThread(a.dataset.thread);
  }));
}

async function loadPeople(ids) {
  const unique = [...new Set(ids)];
  if (!unique.length) return {};
  const { data } = await sb.from('profiles').select('id, name, role, email').in('id', unique);
  const map = {};
  (data || []).forEach(p => { map[p.id] = p; });
  return map;
}

async function showThread(threadId) {
  history.replaceState(null, '', 'admin-consult.html?t=' + threadId);
  contentEl.innerHTML = '<div class="loading">불러오는 중...</div>';
  const { data: thread, error } = await sb
    .from('consult_threads')
    .select('id, subject, status, author_id, created_at')
    .eq('id', threadId)
    .single();
  if (error || !thread) {
    contentEl.innerHTML = '<p class="empty-note">상담을 찾을 수 없어요.</p><button class="btn-small" id="backBtn">목록으로</button>';
    document.getElementById('backBtn').addEventListener('click', showList);
    return;
  }
  const people = await loadPeople([thread.author_id]);
  const author = people[thread.author_id] || {};
  const closed = thread.status === 'closed';

  contentEl.innerHTML = `
    <button class="talk-back" id="backBtn">← 상담함</button>
    <div class="talk-head">
      <div>
        <h1>${escapeHtml(thread.subject)}</h1>
        <div class="talk-meta">${escapeHtml(author.name || '(알 수 없음)')} ${ROLE_LABEL[author.role] ? '· ' + ROLE_LABEL[author.role] : ''} ${author.email ? '· ' + escapeHtml(author.email) : ''}</div>
      </div>
      ${talkStatusBadge(thread.status, true)}
    </div>
    <div class="talk-chat" id="chat"><div class="loading">불러오는 중...</div></div>
    <div class="talk-compose">
      <textarea id="replyBody" rows="4" maxlength="3000" placeholder="답변을 적어 주세요."></textarea>
      <button class="btn-small" id="replyBtn">답변 보내기</button>
    </div>
    <div class="talk-msg" id="replyMsg"></div>
    <div style="margin-top:12px;">
      <button class="talk-link-btn" id="closeBtn">${closed ? '상담 다시 열기' : '상담 마무리하기 (상대방이 더 이상 답장할 수 없어요)'}</button>
    </div>
  `;
  document.getElementById('backBtn').addEventListener('click', showList);
  document.getElementById('replyBtn').addEventListener('click', () => sendReply(thread.id));
  document.getElementById('closeBtn').addEventListener('click', async () => {
    const next = closed ? 'answered' : 'closed';
    const { error: e } = await sb.from('consult_threads').update({ status: next }).eq('id', thread.id);
    if (e) { alert('변경하지 못했어요: ' + e.message); return; }
    showThread(thread.id);
  });

  await loadMessages(thread.id, author.name || '상대방');
  startRealtime(thread.id, author.name || '상대방');
}

async function loadMessages(threadId, authorName) {
  const chat = document.getElementById('chat');
  if (!chat) return;
  const { data, error } = await sb
    .from('consult_messages')
    .select('id, from_teacher, body, created_at')
    .eq('thread_id', threadId)
    .order('created_at');
  if (error) { chat.innerHTML = `<p class="empty-note">${escapeHtml(error.message)}</p>`; return; }
  chat.innerHTML = data.map(m => talkBubble({
    mine: m.from_teacher,
    who: m.from_teacher ? '선생님(나)' : authorName,
    body: m.body,
    at: m.created_at,
  })).join('') || '<p class="empty-note">메시지가 없어요.</p>';
  chat.scrollTop = chat.scrollHeight;
}

async function sendReply(threadId) {
  const ta = document.getElementById('replyBody');
  const body = ta.value.trim();
  if (!body) return;
  const btn = document.getElementById('replyBtn');
  btn.disabled = true;
  const { error } = await sb.from('consult_messages').insert({ thread_id: threadId, sender_id: me.id, body });
  btn.disabled = false;
  if (error) { document.getElementById('replyMsg').textContent = '보내지 못했어요: ' + error.message; return; }
  ta.value = '';
  showThread(threadId);
}

function startRealtime(threadId, authorName) {
  stopRealtime();
  channel = sb.channel('admin-consult-' + threadId)
    .on('postgres_changes',
      { event: 'INSERT', schema: 'public', table: 'consult_messages', filter: 'thread_id=eq.' + threadId },
      () => loadMessages(threadId, authorName))
    .subscribe();
}
function stopRealtime() {
  if (channel) { sb.removeChannel(channel); channel = null; }
}

init();
</script>
</body>
</html>
