<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>비밀번호 재설정 | ARK STUDY LAB</title>
<meta name="robots" content="noindex,nofollow">
<link rel="stylesheet" href="app-style.css">
</head>
<body>

<div class="topbar">
  <a href="index.html" class="logo">ARK <span>STUDY LAB</span></a>
</div>

<div class="page-wrap">
  <div class="card" id="content">
    <div class="loading">링크를 확인하는 중...</div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="supabase-client.js"></script>
<script>
const contentEl = document.getElementById('content');
let shown = false;

sb.auth.onAuthStateChange((event, session) => {
  if (event === 'PASSWORD_RECOVERY' && !shown) {
    showForm();
  }
});

async function init() {
  // 이메일 링크의 토큰을 supabase-js가 처리할 시간을 잠깐 준 뒤 세션 확인
  setTimeout(async () => {
    if (shown) return;
    const { data: { session } } = await sb.auth.getSession();
    if (session) {
      showForm();
    } else {
      showInvalidLink();
    }
  }, 1200);
}

function showInvalidLink() {
  contentEl.innerHTML = `
    <div class="locked-box">
      <div class="icon">⚠️</div>
      <h2>유효하지 않거나 만료된 링크예요</h2>
      <p>로그인 화면에서 "비밀번호를 잊으셨나요?"를 눌러 재설정 이메일을 다시 받아주세요.</p>
    </div>
    <div class="switch-link"><a href="login.html">로그인으로 가기</a></div>
  `;
}

function showForm() {
  shown = true;
  contentEl.innerHTML = `
    <h1>새 비밀번호 설정</h1>
    <p class="sub">사용하실 새 비밀번호를 입력해주세요.</p>

    <div id="msg" class="msg"></div>

    <form id="pwForm">
      <div class="form-group">
        <label>새 비밀번호</label>
        <input type="password" id="newPw" required minlength="8" placeholder="8자 이상">
      </div>
      <div class="form-group">
        <label>새 비밀번호 확인</label>
        <input type="password" id="newPwConfirm" required minlength="8" placeholder="한 번 더 입력해주세요">
      </div>
      <button type="submit" class="btn" id="submitBtn">비밀번호 저장</button>
    </form>
  `;

  document.getElementById('pwForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const newPw = document.getElementById('newPw').value;
    const newPwConfirm = document.getElementById('newPwConfirm').value;
    const submitBtn = document.getElementById('submitBtn');

    if (newPw !== newPwConfirm) {
      showMsg('입력한 두 비밀번호가 서로 달라요.', 'error');
      return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = '저장 중...';

    const { error } = await sb.auth.updateUser({ password: newPw });

    if (error) {
      showMsg('변경 실패: ' + error.message, 'error');
      submitBtn.disabled = false;
      submitBtn.textContent = '비밀번호 저장';
      return;
    }

    showMsg('비밀번호가 변경되었습니다. 잠시 후 로그인 화면으로 이동합니다.', 'success');
    await sb.auth.signOut();
    setTimeout(() => { window.location.href = 'login.html'; }, 1800);
  });
}

function showMsg(text, type) {
  const el = document.getElementById('msg');
  el.textContent = text;
  el.className = 'msg show ' + type;
}

init();
</script>
</body>
</html>
