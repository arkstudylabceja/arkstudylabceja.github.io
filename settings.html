<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>계정 설정 | ARK STUDY LAB</title>
<link rel="stylesheet" href="app-style.css">
</head>
<body>

<div class="topbar">
  <a href="index.html" class="logo">ARK <span>STUDY LAB</span></a>
  <div class="top-actions">
    <span id="userName"></span>
    <button id="logoutBtn">로그아웃</button>
  </div>
</div>

<div class="page-wrap">
  <div class="card" id="content">
    <div class="loading">불러오는 중...</div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="supabase-client.js"></script>
<script>
let homePage = 'index.html';

async function init() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) {
    window.location.href = 'login.html';
    return;
  }

  const { data: profile, error } = await sb
    .from('profiles')
    .select('*')
    .eq('id', session.user.id)
    .single();

  if (error || !profile) {
    document.getElementById('content').innerHTML = '<p>프로필을 불러오지 못했습니다.</p>';
    return;
  }

  homePage = profile.role === 'parent' ? 'parent.html'
           : profile.role === 'admin'  ? 'admin.html'
           : 'student.html';

  document.getElementById('userName').textContent = profile.name + '님';
  render();
}

function render() {
  document.getElementById('content').innerHTML = `
    <h1>계정 설정</h1>
    <p class="sub">비밀번호를 변경할 수 있어요.</p>

    <div id="msg" class="msg"></div>

    <form id="pwForm">
      <div class="form-group">
        <label>새 비밀번호</label>
        <input type="password" id="newPw" required minlength="8" placeholder="8자 이상">
      </div>
      <div class="form-group">
        <label>새 비밀번호 확인</label>
        <input type="password" id="newPwConfirm" required minlength="8" placeholder="한 번 더 입력해주세요">
      </div>
      <button type="submit" class="btn" id="submitBtn">비밀번호 변경</button>
    </form>

    <div class="switch-link"><a href="${homePage}">← 뒤로 가기</a></div>
  `;

  document.getElementById('pwForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const newPw = document.getElementById('newPw').value;
    const newPwConfirm = document.getElementById('newPwConfirm').value;
    const submitBtn = document.getElementById('submitBtn');

    if (newPw !== newPwConfirm) {
      showMsg('입력한 두 비밀번호가 서로 달라요.', 'error');
      return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = '변경 중...';

    const { error } = await sb.auth.updateUser({ password: newPw });

    submitBtn.disabled = false;
    submitBtn.textContent = '비밀번호 변경';

    if (error) {
      showMsg('변경 실패: ' + error.message, 'error');
      return;
    }

    showMsg('비밀번호가 변경되었습니다.', 'success');
    document.getElementById('pwForm').reset();
  });
}

function showMsg(text, type) {
  const el = document.getElementById('msg');
  el.textContent = text;
  el.className = 'msg show ' + type;
}

document.getElementById('logoutBtn').addEventListener('click', async () => {
  await sb.auth.signOut();
  window.location.href = 'login.html';
});

init();
</script>
</body>
</html>
