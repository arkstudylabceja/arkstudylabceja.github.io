<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>인증방 관리 | ARK STUDY LAB</title>
<meta name="robots" content="noindex,nofollow">
<link rel="stylesheet" href="app-style.css">
</head>
<body>

<div class="topbar">
  <a href="index.html" class="logo">ARK <span>STUDY LAB</span></a>
  <div class="top-actions">
    <a href="admin.html">학생·학부모 관리</a>
    <a href="settings.html">⚙️ 설정</a>
    <span id="userName"></span>
    <button id="logoutBtn">로그아웃</button>
  </div>
</div>

<div class="page-wrap top">
  <div class="card xwide" id="content">
    <div class="loading">불러오는 중...</div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="supabase-client.js"></script>
<script>
const contentEl = document.getElementById('content');
let students = [];
let teams = [];
let membersByTeam = {};
let postsByStudent = {};
let postsByTeam = {};
const IMAGE_BUCKET = 'team-post-images';

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function escapeAttr(str) {
  return escapeHtml(str).replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

async function init() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) {
    window.location.href = 'login.html';
    return;
  }

  const { data: profile, error } = await sb
    .from('profiles')
    .select('*')
    .eq('id', session.user.id)
    .single();

  if (error || !profile) {
    contentEl.innerHTML = '<p>프로필을 불러오지 못했습니다.</p>';
    return;
  }

  if (profile.role !== 'admin') {
    window.location.href = profile.role === 'parent' ? 'parent.html' : 'student.html';
    return;
  }

  document.getElementById('userName').textContent = profile.name + '님 (관리자)';
  window.__myId = profile.id;

  await loadAll();
}

async function loadAll() {
  const [studentsRes, teamsRes, membersRes, postsRes] = await Promise.all([
    sb.from('profiles').select('id, name, email').eq('role', 'student'),
    sb.from('teams').select('*').order('created_at', { ascending: false }),
    sb.from('team_members').select('id, team_id, student_id, profiles(name)'),
    sb.from('team_posts').select('id, team_id, student_id, content, image_path, created_at, profiles(name)').order('created_at', { ascending: false })
  ]);

  if (studentsRes.error || teamsRes.error || membersRes.error || postsRes.error) {
    contentEl.innerHTML = `<p>불러오기 실패: ${(studentsRes.error || teamsRes.error || membersRes.error || postsRes.error).message}</p>`;
    return;
  }

  students = studentsRes.data;
  teams = teamsRes.data;

  membersByTeam = {};
  membersRes.data.forEach(m => {
    if (!membersByTeam[m.team_id]) membersByTeam[m.team_id] = [];
    membersByTeam[m.team_id].push(m);
  });

  const postsWithImages = await Promise.all(postsRes.data.map(async post => {
    let imageUrl = null;
    if (post.image_path) {
      const { data } = await sb.storage.from(IMAGE_BUCKET).createSignedUrl(post.image_path, 3600);
      imageUrl = data ? data.signedUrl : null;
    }
    return { ...post, imageUrl };
  }));

  postsByStudent = {};
  postsByTeam = {};
  postsWithImages.forEach(post => {
    if (!postsByStudent[post.student_id]) postsByStudent[post.student_id] = [];
    postsByStudent[post.student_id].push(post);
    if (!postsByTeam[post.team_id]) postsByTeam[post.team_id] = [];
    postsByTeam[post.team_id].push(post);
  });

  render();
}

function render() {
  const assignedIds = new Set(Object.values(membersByTeam).flat().map(m => m.student_id));

  contentEl.innerHTML = `
    <h1>🧑‍🤝‍🧑 인증방 관리</h1>
    <p class="sub">학생들을 인증방에 배정해 함께 공부 기록을 나누게 할 수 있어요.</p>

    <div id="msg" class="msg"></div>

    <form id="newTeamForm" style="margin-bottom:32px;">
      <div class="form-row">
        <div class="form-group">
          <label>인증방 이름</label>
          <input type="text" id="teamName" required placeholder="예: 중등 수학 인증방">
        </div>
        <div class="form-group">
          <label>설명 (선택)</label>
          <input type="text" id="teamDesc" placeholder="예: 중2 수학 스터디">
        </div>
      </div>
      <button type="submit" class="btn" id="createBtn" style="width:auto;padding:12px 24px;">+ 새 인증방 만들기</button>
    </form>

    <div id="teamsWrap">${teams.map(t => renderTeamCard(t, assignedIds)).join('') || '<p class="empty-note">아직 만든 인증방이 없어요.</p>'}</div>
  `;

  document.getElementById('newTeamForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const createBtn = document.getElementById('createBtn');
    const name = document.getElementById('teamName').value.trim();
    const description = document.getElementById('teamDesc').value.trim();

    createBtn.disabled = true;
    createBtn.textContent = '만드는 중...';

    const { error } = await sb.from('teams').insert({
      name,
      description: description || null,
      created_by: window.__myId
    });

    createBtn.disabled = false;
    createBtn.textContent = '+ 새 인증방 만들기';

    if (error) {
      showMsg('인증방 생성 실패: ' + error.message, 'error');
      return;
    }

    document.getElementById('newTeamForm').reset();
    await loadAll();
  });

  bindTeamCardEvents();
}

function renderTeamCard(team, assignedIds) {
  const members = membersByTeam[team.id] || [];
  const teamPosts = postsByTeam[team.id] || [];
  const memberOptionsHtml = students
    .filter(s => !members.some(m => m.student_id === s.id))
    .map(s => `<option value="${s.id}">${escapeHtml(s.name)}${assignedIds.has(s.id) ? ' (다른 인증방 소속)' : ''}</option>`)
    .join('');

  const activityHtml = members.map(member => {
    const posts = (postsByStudent[member.student_id] || []).filter(post => post.team_id === team.id);
    const latest = posts.reduce((value, post) => !value || post.created_at > value ? post.created_at : value, null);
    const daysSince = latest ? Math.floor((Date.now() - new Date(latest).getTime()) / 86400000) : null;
    const inactive = daysSince === null || daysSince >= 7;
    const latestText = latest ? new Date(latest).toLocaleDateString('ko-KR') : '기록 없음';
    return `
      <div class="activity-row" style="display:grid;grid-template-columns:minmax(100px,1fr) auto auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid #edf0f5;">
        <strong>${escapeHtml(member.profiles ? member.profiles.name : '알 수 없음')}</strong>
        <span style="font-size:13px;color:var(--muted);">게시물 ${posts.length}개 · 최근 ${latestText}</span>
        <span class="role-badge ${inactive ? 'parent' : 'student'}">${inactive ? '확인 필요' : '활동 중'}</span>
      </div>`;
  }).join('');

  const postsHtml = teamPosts.map(post => `
    <div class="log-entry" style="margin-bottom:10px;">
      <div class="log-main">
        <div class="log-date">${escapeHtml(post.profiles ? post.profiles.name : '알 수 없음')} · ${new Date(post.created_at).toLocaleString('ko-KR')}</div>
        <div class="log-content">${escapeHtml(post.content)}</div>
        ${post.imageUrl ? `<a href="${post.imageUrl}" target="_blank" rel="noopener"><img src="${post.imageUrl}" alt="인증방 공부 사진" style="display:block;max-width:100%;max-height:360px;margin-top:12px;border-radius:12px;object-fit:contain;"></a>` : ''}
      </div>
      <button type="button" class="btn-small" data-delete-post="${post.id}" data-image-path="${post.image_path || ''}" style="color:var(--red);">게시물 삭제</button>
    </div>
  `).join('');

  return `
    <div class="lesson-box" data-team-card="${team.id}">
      <div style="display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap;">
        <div>
          <h3>${escapeHtml(team.name)}</h3>
          ${team.description ? `<p style="margin-bottom:12px;">${escapeHtml(team.description)}</p>` : ''}
        </div>
        <div style="display:flex;gap:6px;">
          <button type="button" class="btn-small" data-edit-team="${team.id}">수정</button>
          <button type="button" class="btn-small" data-delete-team="${team.id}" style="color:var(--red);">삭제</button>
        </div>
      </div>

      <form data-edit-form="${team.id}" style="display:none;margin:12px 0 18px;">
        <div class="form-row">
          <div class="form-group"><label>인증방 이름</label><input type="text" data-edit-name="${team.id}" value="${escapeAttr(team.name)}" required></div>
          <div class="form-group"><label>설명 (선택)</label><input type="text" data-edit-desc="${team.id}" value="${escapeAttr(team.description || '')}"></div>
        </div>
        <div style="display:flex;gap:8px;">
          <button type="submit" class="btn-small">변경 저장</button>
          <button type="button" class="btn-small" data-cancel-edit="${team.id}">취소</button>
        </div>
      </form>

      <div style="margin-bottom:14px;">
        ${members.length === 0
          ? '<p class="empty-note" style="padding:0;">아직 배정된 학생이 없어요.</p>'
          : members.map(m => `
              <span class="role-badge student" style="margin:0 6px 6px 0;display:inline-flex;align-items:center;gap:6px;">
                ${escapeHtml(m.profiles ? m.profiles.name : '알 수 없음')}
                <button data-remove-member="${m.id}" style="border:none;background:none;cursor:pointer;color:var(--red);font-weight:800;">×</button>
              </span>
            `).join('')}
      </div>

      ${members.length ? `
        <div style="margin:4px 0 18px;padding:4px 14px;background:#f8f9fc;border-radius:12px;">
          <div style="padding:10px 0 4px;font-size:13px;font-weight:800;color:var(--navy-deep);">인증 활동 현황</div>
          ${activityHtml}
          <p style="font-size:12px;color:var(--muted);margin:8px 0;">최근 7일간 인증 기록이 없으면 ‘확인 필요’로 표시됩니다.</p>
        </div>` : ''}

      <details style="margin:0 0 18px;">
        <summary style="cursor:pointer;font-weight:800;color:var(--navy-deep);">인증 게시물 관리 (${teamPosts.length}개)</summary>
        <div style="margin-top:12px;">
          ${postsHtml || '<p class="empty-note" style="padding:8px 0;">아직 인증 게시물이 없어요.</p>'}
        </div>
      </details>

      <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;">
        <select data-add-select="${team.id}" style="padding:8px 10px;border:1.5px solid #e2e5ee;border-radius:8px;font-size:13px;">
          <option value="">학생 선택...</option>
          ${memberOptionsHtml}
        </select>
        <button class="btn-small" data-add-btn="${team.id}">인증방에 추가</button>
      </div>
    </div>
  `;
}

function bindTeamCardEvents() {
  document.querySelectorAll('[data-delete-post]').forEach(btn => {
    btn.addEventListener('click', async () => {
      if (!confirm('이 인증 게시물을 삭제할까요? 첨부 사진도 함께 삭제됩니다.')) return;
      const postId = btn.getAttribute('data-delete-post');
      const imagePath = btn.getAttribute('data-image-path');
      const { error } = await sb.from('team_posts').delete().eq('id', postId);
      if (error) {
        showMsg('게시물 삭제 실패: ' + error.message, 'error');
        return;
      }
      if (imagePath) await sb.storage.from(IMAGE_BUCKET).remove([imagePath]);
      await loadAll();
    });
  });

  document.querySelectorAll('[data-edit-team]').forEach(btn => {
    btn.addEventListener('click', () => {
      const teamId = btn.getAttribute('data-edit-team');
      document.querySelector(`[data-edit-form="${teamId}"]`).style.display = 'block';
    });
  });

  document.querySelectorAll('[data-cancel-edit]').forEach(btn => {
    btn.addEventListener('click', () => {
      const teamId = btn.getAttribute('data-cancel-edit');
      document.querySelector(`[data-edit-form="${teamId}"]`).style.display = 'none';
    });
  });

  document.querySelectorAll('[data-edit-form]').forEach(form => {
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const teamId = form.getAttribute('data-edit-form');
      const name = document.querySelector(`[data-edit-name="${teamId}"]`).value.trim();
      const description = document.querySelector(`[data-edit-desc="${teamId}"]`).value.trim();
      if (!name) return;
      const { error } = await sb.from('teams').update({ name, description: description || null }).eq('id', teamId);
      if (error) {
        showMsg('인증방 수정 실패: ' + error.message, 'error');
        return;
      }
      await loadAll();
    });
  });

  document.querySelectorAll('[data-delete-team]').forEach(btn => {
    btn.addEventListener('click', async () => {
      const teamId = btn.getAttribute('data-delete-team');
      const team = teams.find(t => t.id === teamId);
      if (!confirm(`'${team ? team.name : '이 인증방'}'을 삭제할까요? 인증방 게시물도 함께 삭제됩니다.`)) return;
      const { error } = await sb.from('teams').delete().eq('id', teamId);
      if (error) {
        showMsg('인증방 삭제 실패: ' + error.message, 'error');
        return;
      }
      await loadAll();
    });
  });

  document.querySelectorAll('[data-remove-member]').forEach(btn => {
    btn.addEventListener('click', async () => {
      if (!confirm('이 학생을 인증방에서 제외할까요?')) return;
      const id = btn.getAttribute('data-remove-member');
      const { error } = await sb.from('team_members').delete().eq('id', id);
      if (error) {
        showMsg('제외 실패: ' + error.message, 'error');
        return;
      }
      await loadAll();
    });
  });

  document.querySelectorAll('[data-add-btn]').forEach(btn => {
    btn.addEventListener('click', async () => {
      const teamId = btn.getAttribute('data-add-btn');
      const select = document.querySelector(`[data-add-select="${teamId}"]`);
      const studentId = select.value;
      if (!studentId) {
        showMsg('추가할 학생을 먼저 선택해주세요.', 'error');
        return;
      }
      const { error } = await sb.from('team_members').insert({ team_id: teamId, student_id: studentId });
      if (error) {
        showMsg('추가 실패: ' + error.message, 'error');
        return;
      }
      const { error: moveError } = await sb
        .from('team_members')
        .delete()
        .eq('student_id', studentId)
        .neq('team_id', teamId);
      if (moveError) {
        showMsg('학생은 추가되었지만 이전 인증방 정리에 실패했습니다: ' + moveError.message, 'error');
        return;
      }
      await loadAll();
    });
  });
}

function showMsg(text, type) {
  const el = document.getElementById('msg');
  el.textContent = text;
  el.className = 'msg show ' + type;
}

document.getElementById('logoutBtn').addEventListener('click', async () => {
  await sb.auth.signOut();
  window.location.href = 'login.html';
});

init();
</script>
</body>
</html>
