<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>팀 관리 | ARK STUDY LAB</title>
<meta name="robots" content="noindex,nofollow">
<link rel="stylesheet" href="app-style.css">
</head>
<body>

<div class="topbar">
  <a href="index.html" class="logo">ARK <span>STUDY LAB</span></a>
  <div class="top-actions">
    <a href="admin.html">학생·학부모 관리</a>
    <a href="settings.html">⚙️ 설정</a>
    <span id="userName"></span>
    <button id="logoutBtn">로그아웃</button>
  </div>
</div>

<div class="page-wrap top">
  <div class="card xwide" id="content">
    <div class="loading">불러오는 중...</div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="supabase-client.js"></script>
<script>
const contentEl = document.getElementById('content');
let students = [];
let teams = [];
let membersByTeam = {};

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

async function init() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) {
    window.location.href = 'login.html';
    return;
  }

  const { data: profile, error } = await sb
    .from('profiles')
    .select('*')
    .eq('id', session.user.id)
    .single();

  if (error || !profile) {
    contentEl.innerHTML = '<p>프로필을 불러오지 못했습니다.</p>';
    return;
  }

  if (profile.role !== 'admin') {
    window.location.href = profile.role === 'parent' ? 'parent.html' : 'student.html';
    return;
  }

  document.getElementById('userName').textContent = profile.name + '님 (관리자)';
  window.__myId = profile.id;

  await loadAll();
}

async function loadAll() {
  const [studentsRes, teamsRes, membersRes] = await Promise.all([
    sb.from('profiles').select('id, name, email').eq('role', 'student'),
    sb.from('teams').select('*').order('created_at', { ascending: false }),
    sb.from('team_members').select('id, team_id, student_id, profiles(name)')
  ]);

  if (studentsRes.error || teamsRes.error || membersRes.error) {
    contentEl.innerHTML = `<p>불러오기 실패: ${(studentsRes.error || teamsRes.error || membersRes.error).message}</p>`;
    return;
  }

  students = studentsRes.data;
  teams = teamsRes.data;

  membersByTeam = {};
  membersRes.data.forEach(m => {
    if (!membersByTeam[m.team_id]) membersByTeam[m.team_id] = [];
    membersByTeam[m.team_id].push(m);
  });

  render();
}

function render() {
  const assignedIds = new Set(Object.values(membersByTeam).flat().map(m => m.student_id));

  contentEl.innerHTML = `
    <h1>🧑‍🤝‍🧑 팀 관리</h1>
    <p class="sub">학생들을 팀으로 묶어 함께 공부 기록을 나누게 할 수 있어요.</p>

    <div id="msg" class="msg"></div>

    <form id="newTeamForm" style="margin-bottom:32px;">
      <div class="form-row">
        <div class="form-group">
          <label>팀 이름</label>
          <input type="text" id="teamName" required placeholder="예: 1팀">
        </div>
        <div class="form-group">
          <label>설명 (선택)</label>
          <input type="text" id="teamDesc" placeholder="예: 중2 수학 스터디">
        </div>
      </div>
      <button type="submit" class="btn" id="createBtn" style="width:auto;padding:12px 24px;">+ 새 팀 만들기</button>
    </form>

    <div id="teamsWrap">${teams.map(t => renderTeamCard(t, assignedIds)).join('') || '<p class="empty-note">아직 만든 팀이 없어요.</p>'}</div>
  `;

  document.getElementById('newTeamForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const createBtn = document.getElementById('createBtn');
    const name = document.getElementById('teamName').value.trim();
    const description = document.getElementById('teamDesc').value.trim();

    createBtn.disabled = true;
    createBtn.textContent = '만드는 중...';

    const { error } = await sb.from('teams').insert({
      name,
      description: description || null,
      created_by: window.__myId
    });

    createBtn.disabled = false;
    createBtn.textContent = '+ 새 팀 만들기';

    if (error) {
      showMsg('팀 생성 실패: ' + error.message, 'error');
      return;
    }

    document.getElementById('newTeamForm').reset();
    await loadAll();
  });

  bindTeamCardEvents();
}

function renderTeamCard(team, assignedIds) {
  const members = membersByTeam[team.id] || [];
  const memberOptionsHtml = students
    .filter(s => !members.some(m => m.student_id === s.id))
    .map(s => `<option value="${s.id}">${escapeHtml(s.name)}${assignedIds.has(s.id) ? ' (다른 팀 소속)' : ''}</option>`)
    .join('');

  return `
    <div class="lesson-box" data-team-card="${team.id}">
      <h3>${escapeHtml(team.name)}</h3>
      ${team.description ? `<p style="margin-bottom:12px;">${escapeHtml(team.description)}</p>` : ''}

      <div style="margin-bottom:14px;">
        ${members.length === 0
          ? '<p class="empty-note" style="padding:0;">아직 배정된 학생이 없어요.</p>'
          : members.map(m => `
              <span class="role-badge student" style="margin:0 6px 6px 0;display:inline-flex;align-items:center;gap:6px;">
                ${escapeHtml(m.profiles ? m.profiles.name : '알 수 없음')}
                <button data-remove-member="${m.id}" style="border:none;background:none;cursor:pointer;color:var(--red);font-weight:800;">×</button>
              </span>
            `).join('')}
      </div>

      <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;">
        <select data-add-select="${team.id}" style="padding:8px 10px;border:1.5px solid #e2e5ee;border-radius:8px;font-size:13px;">
          <option value="">학생 선택...</option>
          ${memberOptionsHtml}
        </select>
        <button class="btn-small" data-add-btn="${team.id}">팀에 추가</button>
      </div>
    </div>
  `;
}

function bindTeamCardEvents() {
  document.querySelectorAll('[data-remove-member]').forEach(btn => {
    btn.addEventListener('click', async () => {
      if (!confirm('이 학생을 팀에서 제외할까요?')) return;
      const id = btn.getAttribute('data-remove-member');
      const { error } = await sb.from('team_members').delete().eq('id', id);
      if (error) {
        showMsg('제외 실패: ' + error.message, 'error');
        return;
      }
      await loadAll();
    });
  });

  document.querySelectorAll('[data-add-btn]').forEach(btn => {
    btn.addEventListener('click', async () => {
      const teamId = btn.getAttribute('data-add-btn');
      const select = document.querySelector(`[data-add-select="${teamId}"]`);
      const studentId = select.value;
      if (!studentId) {
        showMsg('추가할 학생을 먼저 선택해주세요.', 'error');
        return;
      }
      const { error } = await sb.from('team_members').insert({ team_id: teamId, student_id: studentId });
      if (error) {
        showMsg('추가 실패: ' + error.message, 'error');
        return;
      }
      await loadAll();
    });
  });
}

function showMsg(text, type) {
  const el = document.getElementById('msg');
  el.textContent = text;
  el.className = 'msg show ' + type;
}

document.getElementById('logoutBtn').addEventListener('click', async () => {
  await sb.auth.signOut();
  window.location.href = 'login.html';
});

init();
</script>
</body>
</html>
