<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>학습 인증방 | ARK STUDY LAB</title>
<meta name="robots" content="noindex,nofollow">
<link rel="stylesheet" href="app-style.css">
</head>
<body>

<div class="topbar">
  <a href="index.html" class="logo">ARK <span>STUDY LAB</span></a>
  <div class="top-actions">
    <a href="student.html">강의실로</a>
    <span id="userName"></span>
    <button id="logoutBtn">로그아웃</button>
  </div>
</div>

<div class="page-wrap top">
  <div class="card wide" id="content">
    <div class="loading">불러오는 중...</div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="supabase-client.js"></script>
<script>
const contentEl = document.getElementById('content');
let myId = null;
let myTeamId = null;
const IMAGE_BUCKET = 'team-post-images';

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

async function init() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) {
    window.location.href = 'login.html';
    return;
  }

  const { data: profile, error } = await sb
    .from('profiles')
    .select('*')
    .eq('id', session.user.id)
    .single();

  if (error || !profile) {
    contentEl.innerHTML = '<p>프로필을 불러오지 못했습니다.</p>';
    return;
  }

  if (profile.role !== 'student') {
    window.location.href = profile.role === 'parent' ? 'parent.html' : 'admin.html';
    return;
  }

  myId = profile.id;
  document.getElementById('userName').textContent = profile.name + '님';

  const { data: membership, error: memberError } = await sb
    .from('team_members')
    .select('team_id, teams(name, description)')
    .eq('student_id', myId)
    .maybeSingle();

  if (memberError) {
    contentEl.innerHTML = `<p>팀 정보를 불러오지 못했습니다: ${memberError.message}</p>`;
    return;
  }

  if (!membership) {
    contentEl.innerHTML = `
      <div class="locked-box">
        <div class="icon">🧑‍🤝‍🧑</div>
        <h2>아직 배정된 인증방이 없어요</h2>
        <p>관리자가 인증방을 배정하면 이 페이지에서 참여 학생들과 공부 기록을 나눌 수 있어요. 잠시만 기다려주세요.</p>
      </div>`;
    return;
  }

  myTeamId = membership.team_id;
  await renderTeam(membership.teams);
}

async function renderTeam(team) {
  const { data: members, error: membersError } = await sb
    .from('team_members')
    .select('student_id, profiles(name)')
    .eq('team_id', myTeamId);

  const memberNames = membersError || !members
    ? []
    : members.map(m => m.profiles ? m.profiles.name : '(알 수 없음)');

  contentEl.innerHTML = `
    <h1>🧑‍🤝‍🧑 ${escapeHtml(team.name)}</h1>
    ${team.description ? `<p class="sub">${escapeHtml(team.description)}</p>` : ''}
    <p class="sub">인증방 참여 학생: ${memberNames.map(escapeHtml).join(', ') || '-'}</p>

    <div id="msg" class="msg"></div>

    <form id="postForm">
      <div class="form-group">
        <textarea id="postContent" required placeholder="오늘 참여 학생들과 나누고 싶은 공부 이야기를 남겨보세요"></textarea>
      </div>
      <div class="form-group">
        <label for="postImage">공부 사진 (선택, 최대 5MB)</label>
        <input id="postImage" type="file" accept="image/jpeg,image/png,image/webp,image/gif">
      </div>
      <button type="submit" class="btn" id="submitBtn">게시하기</button>
    </form>

    <h2 style="margin-top:32px;font-size:18px;color:var(--navy-deep);margin-bottom:16px;">인증 게시물</h2>
    <div id="postList"><div class="loading">불러오는 중...</div></div>
  `;

  document.getElementById('postForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const submitBtn = document.getElementById('submitBtn');
    const content = document.getElementById('postContent').value.trim();
    const imageFile = document.getElementById('postImage').files[0];
    if (!content) return;

    if (imageFile && imageFile.size > 5 * 1024 * 1024) {
      showMsg('사진은 5MB 이하만 올릴 수 있어요.', 'error');
      return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = '게시 중...';

    let imagePath = null;
    if (imageFile) {
      const extension = (imageFile.name.split('.').pop() || 'jpg').toLowerCase().replace(/[^a-z0-9]/g, '') || 'jpg';
      imagePath = `${myId}/${crypto.randomUUID()}.${extension}`;
      const { error: uploadError } = await sb.storage.from(IMAGE_BUCKET).upload(imagePath, imageFile, {
        cacheControl: '3600',
        contentType: imageFile.type,
        upsert: false
      });
      if (uploadError) {
        submitBtn.disabled = false;
        submitBtn.textContent = '게시하기';
        showMsg('사진 업로드 실패: ' + uploadError.message, 'error');
        return;
      }
    }

    const { error } = await sb.from('team_posts').insert({
      team_id: myTeamId,
      student_id: myId,
      content,
      image_path: imagePath
    });

    submitBtn.disabled = false;
    submitBtn.textContent = '게시하기';

    if (error) {
      if (imagePath) await sb.storage.from(IMAGE_BUCKET).remove([imagePath]);
      showMsg('게시 실패: ' + error.message, 'error');
      return;
    }

    document.getElementById('postForm').reset();
    await loadPosts();
  });

  await loadPosts();
}

function showMsg(text, type) {
  const el = document.getElementById('msg');
  el.textContent = text;
  el.className = 'msg show ' + type;
}

async function loadPosts() {
  const listEl = document.getElementById('postList');
  const { data: posts, error } = await sb
    .from('team_posts')
    .select('id, content, image_path, created_at, student_id, profiles(name)')
    .eq('team_id', myTeamId)
    .order('created_at', { ascending: false });

  if (error) {
    listEl.innerHTML = `<p class="empty-note">게시물을 불러오지 못했습니다: ${error.message}</p>`;
    return;
  }

  if (!posts || posts.length === 0) {
    listEl.innerHTML = '<p class="empty-note">아직 인증 게시물이 없어요. 첫 글을 남겨보세요!</p>';
    return;
  }

  const postsWithImages = await Promise.all(posts.map(async post => {
    let imageUrl = null;
    if (post.image_path) {
      const { data } = await sb.storage.from(IMAGE_BUCKET).createSignedUrl(post.image_path, 3600);
      imageUrl = data ? data.signedUrl : null;
    }
    return { ...post, imageUrl };
  }));

  listEl.innerHTML = postsWithImages.map(post => {
    const imageUrl = post.imageUrl;
    return `
    <div class="log-entry">
      <div class="log-main">
        <div class="log-date">${escapeHtml(post.profiles ? post.profiles.name : '알 수 없음')} · ${new Date(post.created_at).toLocaleString('ko-KR')}</div>
        <div class="log-content">${escapeHtml(post.content)}</div>
        ${imageUrl ? `<a href="${imageUrl}" target="_blank" rel="noopener"><img src="${imageUrl}" alt="공부 인증 사진" style="display:block;max-width:100%;max-height:420px;margin-top:12px;border-radius:12px;object-fit:contain;"></a>` : ''}
      </div>
      ${post.student_id === myId ? `<button class="btn-small" data-delete="${post.id}" data-image-path="${post.image_path || ''}">삭제</button>` : ''}
    </div>
  `}).join('');

  listEl.querySelectorAll('[data-delete]').forEach(btn => {
    btn.addEventListener('click', async () => {
      if (!confirm('이 게시물을 삭제할까요?')) return;
      const id = btn.getAttribute('data-delete');
      const imagePath = btn.getAttribute('data-image-path');
      const { error: delError } = await sb.from('team_posts').delete().eq('id', id);
      if (delError) {
        alert('삭제 실패: ' + delError.message);
        return;
      }
      if (imagePath) await sb.storage.from(IMAGE_BUCKET).remove([imagePath]);
      await loadPosts();
    });
  });
}

document.getElementById('logoutBtn').addEventListener('click', async () => {
  await sb.auth.signOut();
  window.location.href = 'login.html';
});

init();
</script>
</body>
</html>
