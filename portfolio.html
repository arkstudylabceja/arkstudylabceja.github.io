<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>학생 개인 자료실 | ARK STUDY LAB</title>
<meta name="robots" content="noindex,nofollow">
<link rel="stylesheet" href="app-style.css?v=20261117e">
</head>
<body>

<div class="topbar">
  <a href="index.html" class="logo">ARK <span>STUDY LAB</span></a>
  <div class="top-actions">
    <a href="student.html">강의실로</a>
    <span id="userName"></span>
    <button id="logoutBtn">로그아웃</button>
  </div>
</div>

<div class="page-wrap top">
  <div class="card wide" id="content">
    <div class="loading">불러오는 중...</div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="supabase-client.js"></script>
<script src="study-feedback.js?v=20261117e"></script>
<script>
const contentEl = document.getElementById('content');
let myId = null;
const IMAGE_BUCKET = 'study-log-images';

async function init() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) {
    window.location.href = 'login.html';
    return;
  }

  const { data: profile, error } = await sb
    .from('profiles')
    .select('*')
    .eq('id', session.user.id)
    .single();

  if (error || !profile) {
    contentEl.innerHTML = '<p>프로필을 불러오지 못했습니다.</p>';
    return;
  }

  if (profile.account_status === 'suspended') {
    await sb.auth.signOut();
    window.location.href = 'login.html?suspended=1';
    return;
  }

  if (profile.role !== 'student') {
    window.location.href = profile.role === 'parent' ? 'parent.html' : 'admin.html';
    return;
  }

  document.getElementById('userName').textContent = profile.name + '님';

  if (!profile.guardian_consent_at) {
    contentEl.innerHTML = `
      <div class="locked-box">
        <div class="icon">🛡️</div>
        <h2>학부모 승인을 기다리고 있어요</h2>
        <p>연결된 학부모가 학부모 계정으로 로그인해 개인정보 처리와 서비스 이용에 동의하면 개인 자료실이 열립니다.</p>
      </div>`;
    return;
  }

  if (!profile.parent_email) {
    contentEl.innerHTML = `
      <div class="locked-box">
        <div class="icon">⚠️</div>
        <h2>연결된 학부모 계정이 없어요</h2>
        <p>가입 시 입력한 학부모 이메일이 없습니다. 운영진에게 문의해주세요.</p>
      </div>`;
    return;
  }

  const { data: parentStatus, error: parentError } = await sb
    .rpc('get_my_parent_status')
    .maybeSingle();

  if (parentError || !parentStatus) {
    contentEl.innerHTML = `
      <div class="locked-box">
        <div class="icon">🔍</div>
        <h2>학부모 계정을 찾을 수 없어요</h2>
        <p>입력하신 학부모 이메일(${profile.parent_email})로 가입된 학부모 계정이 아직 없어요. 학부모님이 먼저 회원가입을 해주셔야 합니다.</p>
      </div>`;
    return;
  }

  if (!parentStatus.course_completed) {
    contentEl.innerHTML = `
      <div class="locked-box">
        <div class="icon">🔒</div>
        <h2>아직 개인 자료실이 열리지 않았어요</h2>
        <p>학부모님(${parentStatus.parent_name})이 자기주도학습 강의를 완료하시면 개인 자료실이 열려요. 학부모님께 먼저 강의 수강을 부탁드려주세요.</p>
      </div>`;
    return;
  }

  myId = profile.id;

  renderShell();
  await loadLogs();
}

function renderShell() {
  contentEl.innerHTML = `
    <h1>📂 내 개인 자료실</h1>
    <p class="sub">오늘 공부한 내용을 기록하고, 꾸준히 쌓아가 보세요.</p>

    <div id="msg" class="msg"></div>

    <form id="logForm">
      <div class="form-row">
        <div class="form-group">
          <label>날짜</label>
          <input type="date" id="studyDate" required>
        </div>
        <div class="form-group">
          <label>과목 (선택)</label>
          <input type="text" id="subject" placeholder="예: 수학, 영어">
        </div>
      </div>
      <div class="form-group">
        <label>공부한 내용</label>
        <textarea id="studyContent" required placeholder="오늘 무엇을 공부했는지 적어보세요"></textarea>
      </div>
      <div class="form-group">
        <label>공부 시간(분, 선택)</label>
        <input type="number" id="minutes" min="0" placeholder="예: 60">
      </div>
      <div class="form-group">
        <label>공부 사진 (선택, 최대 10장)</label>
        <input id="studyImage" type="file" accept="image/*" multiple style="display:none;">
        <button type="button" class="btn btn-secondary" id="addPhotoBtn" style="width:auto;padding:10px 18px;">📷 사진 추가</button>
        <div class="hint">한 장씩 추가해도 되고, 여러 장을 한 번에 골라도 돼요. 사진은 자동으로 용량을 줄여서 저장해요.</div>
        <div class="photo-preview" id="photoPreview"></div>
      </div>
      <button type="submit" class="btn" id="submitBtn">기록 남기기</button>
    </form>

    <h2 style="margin-top:36px;font-size:18px;color:var(--navy-deep);margin-bottom:16px;">지난 기록</h2>
    <div id="logList"><div class="loading">불러오는 중...</div></div>
  `;

  document.getElementById('studyDate').valueAsDate = new Date();

  document.getElementById('addPhotoBtn').addEventListener('click', () => {
    if (selectedPhotos.length >= MAX_PHOTOS_PER_LOG) {
      showMsg(`사진은 ${MAX_PHOTOS_PER_LOG}장까지 올릴 수 있어요.`, 'error');
      return;
    }
    document.getElementById('studyImage').click();
  });

  document.getElementById('studyImage').addEventListener('change', (e) => {
    const files = Array.from(e.target.files || []);
    const room = MAX_PHOTOS_PER_LOG - selectedPhotos.length;
    files.slice(0, room).forEach(f => selectedPhotos.push({ file: f, url: URL.createObjectURL(f) }));
    if (files.length > room) showMsg(`사진은 ${MAX_PHOTOS_PER_LOG}장까지만 올릴 수 있어서 ${files.length - room}장은 빠졌어요.`, 'error');
    e.target.value = '';
    renderPhotoPreview();
  });

  document.getElementById('logForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const submitBtn = document.getElementById('submitBtn');
    submitBtn.disabled = true;
    submitBtn.textContent = '저장 중...';

    const study_date = document.getElementById('studyDate').value;
    const subject = document.getElementById('subject').value.trim();
    const content = document.getElementById('studyContent').value.trim();
    const minutesRaw = document.getElementById('minutes').value;
    const minutes_spent = minutesRaw ? parseInt(minutesRaw, 10) : null;
    const originals = selectedPhotos.map(p => p.file);
    const resetBtn = () => { submitBtn.disabled = false; submitBtn.textContent = '기록 남기기'; };

    if (originals.length > MAX_PHOTOS_PER_LOG) {
      resetBtn();
      showMsg(`사진은 한 번에 ${MAX_PHOTOS_PER_LOG}장까지 올릴 수 있어요.`, 'error');
      return;
    }
    if (originals.some(f => f.size > PHOTO_RAW_MAX_BYTES)) {
      resetBtn();
      showMsg('너무 큰 사진이 있어요. 30MB 이하 사진만 올려주세요.', 'error');
      return;
    }

    const allowedTypes = ['image/jpeg', 'image/png', 'image/webp', 'image/gif'];
    const extensionByType = { 'image/jpeg': 'jpg', 'image/png': 'png', 'image/webp': 'webp', 'image/gif': 'gif' };
    const uploadedPaths = [];
    for (let i = 0; i < originals.length; i++) {
      submitBtn.textContent = `사진 올리는 중... (${i + 1}/${originals.length})`;
      const imageFile = await shrinkPhoto(originals[i]);
      if (!allowedTypes.includes(imageFile.type) || imageFile.size > PHOTO_MAX_BYTES) {
        if (uploadedPaths.length) await sb.storage.from(IMAGE_BUCKET).remove(uploadedPaths);
        resetBtn();
        showMsg(`${i + 1}번째 사진은 올릴 수 없는 형식이에요. 카메라 앱에서 JPG로 저장한 사진을 올려주세요.`, 'error');
        return;
      }
      const path = `${myId}/${crypto.randomUUID()}.${extensionByType[imageFile.type] || 'jpg'}`;
      const { error: uploadError } = await sb.storage.from(IMAGE_BUCKET).upload(path, imageFile, {
        cacheControl: '3600', contentType: imageFile.type, upsert: false
      });
      if (uploadError) {
        if (uploadedPaths.length) await sb.storage.from(IMAGE_BUCKET).remove(uploadedPaths);
        resetBtn();
        showMsg('사진 업로드 실패: ' + uploadError.message, 'error');
        return;
      }
      uploadedPaths.push(path);
    }
    submitBtn.textContent = '저장 중...';
    const imagePath = uploadedPaths[0] || null;

    const { data: inserted, error } = await sb.from('study_logs').insert({
      student_id: myId,
      study_date,
      subject: subject || null,
      content,
      minutes_spent,
      image_path: imagePath
    }).select('id').single();

    submitBtn.disabled = false;
    submitBtn.textContent = '기록 남기기';

    if (error) {
      if (uploadedPaths.length) await sb.storage.from(IMAGE_BUCKET).remove(uploadedPaths);
      showMsg('저장 실패: ' + error.message, 'error');
      return;
    }

    if (uploadedPaths.length) {
      const { error: imgError } = await sb.from('study_log_images').insert(
        uploadedPaths.map((path, i) => ({ log_id: inserted.id, image_path: path, sort_order: i }))
      );
      if (imgError && uploadedPaths.length > 1) {
        showMsg('기록은 저장됐지만 두 번째 사진부터는 저장하지 못했어요: ' + imgError.message, 'error');
        document.getElementById('logForm').reset();
        clearSelectedPhotos();
        document.getElementById('studyDate').valueAsDate = new Date();
        await loadLogs();
        return;
      }
    }

    showMsg('기록이 저장되었습니다.', 'success');
    document.getElementById('logForm').reset();
    clearSelectedPhotos();
    document.getElementById('studyDate').valueAsDate = new Date();
    await loadLogs();
  });
}

let selectedPhotos = [];

function renderPhotoPreview() {
  const preview = document.getElementById('photoPreview');
  preview.innerHTML = selectedPhotos.map((p, i) => `
    <div class="photo-thumb">
      <img src="${p.url}" alt="고른 사진 ${i + 1}">
      <button type="button" data-remove-photo="${i}" aria-label="사진 빼기">×</button>
    </div>`).join('')
    + (selectedPhotos.length ? `<div class="hint" style="width:100%;">${selectedPhotos.length}장 골랐어요 (최대 ${MAX_PHOTOS_PER_LOG}장)</div>` : '');
  preview.querySelectorAll('[data-remove-photo]').forEach(btn => {
    btn.addEventListener('click', () => {
      const i = parseInt(btn.getAttribute('data-remove-photo'), 10);
      URL.revokeObjectURL(selectedPhotos[i].url);
      selectedPhotos.splice(i, 1);
      renderPhotoPreview();
    });
  });
}

function clearSelectedPhotos() {
  selectedPhotos.forEach(p => URL.revokeObjectURL(p.url));
  selectedPhotos = [];
  renderPhotoPreview();
}

function showMsg(text, type) {
  const el = document.getElementById('msg');
  el.textContent = text;
  el.className = 'msg show ' + type;
}

async function loadLogs() {
  const listEl = document.getElementById('logList');
  const { data: logs, error } = await selectWithEmbeds(columns => sb
    .from('study_logs')
    .select(columns)
    .eq('student_id', myId)
    .order('study_date', { ascending: false })
    .order('created_at', { ascending: false }), '*', [IMAGES_EMBED]);

  if (error) {
    listEl.innerHTML = `<p class="empty-note">기록을 불러오지 못했습니다: ${error.message}</p>`;
    return;
  }

  if (!logs || logs.length === 0) {
    listEl.innerHTML = '<p class="empty-note">아직 기록이 없어요. 위에서 첫 기록을 남겨보세요!</p>';
    return;
  }

  const logsWithImages = await attachImageUrls(logs);

  listEl.innerHTML = logsWithImages.map(log => `
    <div class="log-entry" data-id="${log.id}">
      <div class="log-main">
        <div class="log-date">${log.study_date}${log.subject ? ' · ' + escapeHtml(log.subject) : ''}</div>
        <div class="log-content">${escapeHtml(log.content)}</div>
        ${log.minutes_spent ? `<div class="log-minutes">⏱ ${log.minutes_spent}분</div>` : ''}
        ${renderLogImages(log.imageUrls, '개인 자료실 공부 사진')}
      </div>
      <button class="btn-small" data-delete="${log.id}" data-image-paths="${encodeURIComponent(JSON.stringify(log.imagePaths || []))}">삭제</button>
    </div>
  `).join('');

  listEl.querySelectorAll('[data-delete]').forEach(btn => {
    btn.addEventListener('click', async () => {
      if (!confirm('이 기록을 삭제할까요?')) return;
      const id = btn.getAttribute('data-delete');
      let imagePaths = [];
      try { imagePaths = JSON.parse(decodeURIComponent(btn.getAttribute('data-image-paths') || '%5B%5D')); } catch (e) { imagePaths = []; }
      const { error: delError } = await sb.from('study_logs').delete().eq('id', id);
      if (delError) {
        alert('삭제 실패: ' + delError.message);
        return;
      }
      if (imagePaths.length) await sb.storage.from(IMAGE_BUCKET).remove(imagePaths);
      await loadLogs();
    });
  });
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

document.getElementById('logoutBtn').addEventListener('click', async () => {
  await sb.auth.signOut();
  window.location.href = 'login.html';
});

init();
</script>
</body>
</html>
