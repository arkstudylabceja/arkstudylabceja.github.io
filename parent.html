<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>학부모 강의실 | ARK STUDY LAB</title>
<link rel="stylesheet" href="app-style.css">
</head>
<body>

<div class="topbar">
  <a href="index.html" class="logo">ARK <span>STUDY LAB</span></a>
  <div class="top-actions">
    <a href="settings.html">⚙️ 설정</a>
    <span id="userName"></span>
    <button id="logoutBtn">로그아웃</button>
  </div>
</div>

<div class="page-wrap">
  <div class="card wide" id="content">
    <div class="loading">불러오는 중...</div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="supabase-client.js"></script>
<script>
const contentEl = document.getElementById('content');

async function init() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) {
    window.location.href = 'login.html';
    return;
  }

  const { data: profile, error } = await sb
    .from('profiles')
    .select('*')
    .eq('id', session.user.id)
    .single();

  if (error || !profile) {
    contentEl.innerHTML = '<p>프로필을 불러오지 못했습니다.</p>';
    return;
  }

  if (profile.role !== 'parent') {
    window.location.href = 'student.html';
    return;
  }

  document.getElementById('userName').textContent = profile.name + '님';

  render(profile);
}

function render(profile) {
  const badge = profile.course_completed
    ? '<span class="status-badge unlocked">✓ 수강 완료 — 자녀 강의·학습 인증방이 열려있어요</span>'
    : '<span class="status-badge locked">● 미완료 — 아직 자녀 강의·학습 인증방이 잠겨있어요</span>';

  contentEl.innerHTML = `
    <h1>학부모 자기주도학습 강의</h1>
    <p class="sub">이 강의를 완료하시면 자녀의 자기주도학습 강의와 학습 인증방이 열립니다.</p>
    ${badge}

    <div class="lesson-box">
      <h3>1강. 자기주도학습이란 무엇인가</h3>
      <p>아이가 스스로 계획하고 실행하고 점검하는 힘을 기르기 위해, 부모가 먼저 알아야 할 기본 원리를 다룹니다.</p>
    </div>
    <div class="lesson-box">
      <h3>2강. 아이의 학습 동기를 이해하는 법</h3>
      <p>아이마다 다른 학습 동기와 성향을 진단하고, 이를 바탕으로 대화하는 방법을 안내합니다.</p>
    </div>
    <div class="lesson-box">
      <h3>3강. 가정에서 자기주도학습을 지원하는 방법</h3>
      <p>강요하지 않으면서도 꾸준히 함께할 수 있는 구체적인 가정 내 실천 방법을 다룹니다.</p>
    </div>

    <button class="btn" id="completeBtn" ${profile.course_completed ? 'disabled' : ''}>
      ${profile.course_completed ? '수강 완료됨' : '수강 완료 처리하기'}
    </button>

    <h2 style="margin-top:36px;font-size:18px;color:var(--navy-deep);margin-bottom:16px;">📂 자녀 학습 기록</h2>
    <div id="childLogs"><div class="loading">불러오는 중...</div></div>
  `;

  loadChildLogs();

  const completeBtn = document.getElementById('completeBtn');
  if (!profile.course_completed) {
    completeBtn.addEventListener('click', async () => {
      completeBtn.disabled = true;
      completeBtn.textContent = '처리 중...';
      const { error } = await sb
        .from('profiles')
        .update({ course_completed: true })
        .eq('id', profile.id);
      if (error) {
        alert('처리 중 오류가 발생했습니다: ' + error.message);
        completeBtn.disabled = false;
        completeBtn.textContent = '수강 완료 처리하기';
        return;
      }
      profile.course_completed = true;
      render(profile);
    });
  }
}

async function loadChildLogs() {
  const el = document.getElementById('childLogs');
  const { data: logs, error } = await sb
    .from('study_logs')
    .select('id, study_date, subject, content, minutes_spent, profiles(name)')
    .order('study_date', { ascending: false })
    .order('created_at', { ascending: false })
    .limit(5);

  if (error) {
    el.innerHTML = `<p class="empty-note">기록을 불러오지 못했습니다: ${error.message}</p>`;
    return;
  }

  if (!logs || logs.length === 0) {
    el.innerHTML = '<p class="empty-note">아직 자녀가 남긴 학습 기록이 없어요.</p>';
    return;
  }

  el.innerHTML = logs.map(log => `
    <div class="log-entry">
      <div class="log-main">
        <div class="log-date">${log.study_date}${log.subject ? ' · ' + escapeHtml(log.subject) : ''}${log.profiles ? ' · ' + escapeHtml(log.profiles.name) : ''}</div>
        <div class="log-content">${escapeHtml(log.content)}</div>
        ${log.minutes_spent ? `<div class="log-minutes">⏱ ${log.minutes_spent}분</div>` : ''}
      </div>
    </div>
  `).join('');
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

document.getElementById('logoutBtn').addEventListener('click', async () => {
  await sb.auth.signOut();
  window.location.href = 'login.html';
});

init();
</script>
</body>
</html>
